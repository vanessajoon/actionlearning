name: Learning GitActions
on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main
    
    schedule:
      - cron: "10 14 * * 1-5"

permissions:
  contents: read
        
jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Code checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Maven Build
              run: mvn install

            - name: Upload Build Artifact (WAR)
              uses: actions/upload-artifact@v4
              with:
                name: vprofile-app
                path: target/*.var

            - name: Notify if the build fails
              if: failure()
              run: echo "🚨Build Job failed! Please check logs"
    
    Testing:
        runs-on: ubuntu-latest
        needs: Build
        steps:
            - name: Code checkout
              uses: actions/checkout@v4

            - name: Run tests on main branch
              if: github.ref == 'refs/heads/main'
              run: mvn test
              

            - name: Checkstyle
              if: github.ref == 'refs/heads/main'
              run: mvn checkstyle:checkstyle

            - name: Run tests on other branch
              if: github.ref != 'refs/heads/main'
              run: echo "Skipping unit test and code analysis"